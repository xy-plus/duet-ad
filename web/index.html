<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>视频工作室</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden">
  <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-attach" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></symbol>
  <symbol id="i-film" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M8 5v14M16 5v14M3 10h5M3 14h5M16 10h5M16 14h5"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2.5"/><path d="M5 14.5h-.5A2.5 2.5 0 0 1 2 12V4.5A2.5 2.5 0 0 1 4.5 2H12a2.5 2.5 0 0 1 2.5 2.5V5"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 2.6 17.1a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9.2v4.6"/><path d="M12 17h.01"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5.5 11.5 6.5-6.5 6.5 6.5"/></symbol>
  <symbol id="i-sparkle" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5 14 8.6l6.1 2-6.1 2L12 18.7 10 12.6l-6.1-2 6.1-2L12 2.5Z"/></symbol>
</svg>

<div id="login-view" class="login-view" hidden>
  <div class="login-card">
    <div class="brand-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-sparkle"></use></svg></div>
    <h1 class="login-title">视频工作室</h1>
    <p class="login-sub">输入访问口令以继续</p>
    <form id="login-form" novalidate>
      <label class="sr-only" for="login-token">访问口令</label>
      <input id="login-token" class="text-input" type="password" placeholder="访问口令" autocomplete="current-password">
      <p id="login-error" class="form-error" role="alert" hidden></p>
      <button id="login-btn" class="btn btn-primary btn-block" type="submit">进入</button>
    </form>
  </div>
</div>

<div id="app-view" class="app" hidden>
  <div id="drawer-backdrop" class="drawer-backdrop" hidden></div>

  <aside id="sidebar" class="sidebar" aria-label="会话栏">
    <div class="sidebar-top">
      <div class="brand">
        <span class="brand-dot"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-sparkle"></use></svg></span>
        <span>视频工作室</span>
      </div>
      <button id="new-chat-btn" class="btn btn-primary btn-new" type="button">
        <span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-plus"></use></svg></span>新建会话
      </button>
    </div>
    <nav id="conv-list" class="conv-list" aria-label="会话列表"></nav>
    <div class="sidebar-foot">
      <button id="logout-btn" class="btn btn-ghost" type="button">退出登录</button>
    </div>
  </aside>

  <main class="main">
    <header class="main-header">
      <button id="menu-btn" class="icon-btn" type="button" aria-label="打开会话列表" aria-expanded="false">
        <span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-menu"></use></svg></span>
      </button>
      <h1 id="main-title" class="main-title">视频工作室</h1>
    </header>

    <div id="stream" class="stream" aria-live="polite"></div>

    <div class="composer-dock">
      <div class="composer-inner">
        <p id="composer-error" class="inline-error" role="alert" hidden></p>
        <form id="composer" class="composer" novalidate>
          <div class="source-switch" role="radiogroup" aria-label="视频来源">
            <label class="source-option">
              <input type="radio" name="source-mode" value="upload">
              <span>上传视频</span>
            </label>
            <label class="source-option">
              <input type="radio" name="source-mode" value="link" checked>
              <span>视频链接</span>
            </label>
          </div>
          <div id="file-chip" class="file-chip" hidden>
            <span class="ic ic-film"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-film"></use></svg></span>
            <span id="file-chip-name" class="file-chip-name"></span>
            <span id="file-chip-size" class="file-chip-size"></span>
            <button type="button" id="file-remove" class="icon-btn icon-btn-sm" aria-label="移除已选文件">
              <span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-close"></use></svg></span>
            </button>
          </div>
          <div id="url-row" class="composer-row url-row">
            <label class="sr-only" for="url-input">视频链接</label>
            <input id="url-input" class="composer-input" type="url" inputmode="url" autocomplete="off"
                   placeholder="视频链接：http(s) 直链 / TikTok 视频页">
          </div>
          <div class="voice-row" role="radiogroup" aria-label="台词处理">
            <span class="voice-label">台词处理</span>
            <label class="voice-option">
              <input type="radio" name="voice-mode" value="keep" checked>
              <span>原文保持</span>
            </label>
            <label class="voice-option">
              <input type="radio" name="voice-mode" value="rewrite">
              <span>原文改编</span>
            </label>
            <label class="voice-option">
              <input type="radio" name="voice-mode" value="translate">
              <span>翻译为</span>
            </label>
            <label class="sr-only" for="lang-input">翻译目标语言</label>
            <input id="lang-input" class="lang-input" type="text" placeholder="目标语言，如：日语" autocomplete="off" hidden>
          </div>
          <p id="file-hint" class="file-hint" hidden>最长 300 秒 · 最大 500MB · MP4/MOV/WebM；超过 15 秒会拆分为单次不超过 14 秒的视频生成子任务</p>
          <div class="composer-row note-row">
            <button type="button" id="attach-btn" class="icon-btn" aria-label="选择视频文件" hidden>
              <span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-attach"></use></svg></span>
            </button>
            <label class="sr-only" for="note-input">备注</label>
            <input id="note-input" class="composer-input" type="text" placeholder="备注（可选）：想复刻的镜头重点" autocomplete="off">
            <button type="submit" id="send-btn" class="send-btn" aria-label="发送" disabled>
              <span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-send"></use></svg></span>
            </button>
          </div>
          <div id="upload-progress" class="upload-progress" hidden>
            <div class="up-track"><div id="up-fill" class="up-fill"></div></div>
            <span id="up-label" class="up-label">正在上传 0%</span>
          </div>
        </form>
        <p class="composer-hint">提交一段参考视频，AI 将抽取关键帧并准备视频生成</p>
      </div>
    </div>
  </main>

  <input type="file" id="file-input" accept="video/*" hidden>
</div>

<dialog id="pp-dialog" class="pp-dialog" aria-labelledby="pp-title">
  <form id="pp-form" class="pp-form" novalidate>
    <h2 id="pp-title" class="pp-title">后处理关键帧</h2>
    <p class="pp-sub">勾选处理项（至少一项），AI 将逐帧优化并生成对比图</p>
    <p id="pp-lock-hint" class="pp-lock-hint" hidden>已运行过后处理，选项已锁定为上次选择</p>
    <div class="pp-opts" role="group" aria-label="后处理选项">
      <label class="pp-opt">
        <input type="checkbox" name="opt" value="remove_subtitle" checked>
        <span>移除文字/字幕</span>
      </label>
      <label class="pp-opt">
        <input type="checkbox" name="opt" value="remove_brand" checked>
        <span>移除常见 Logo/图标</span>
      </label>
      <label class="pp-opt">
        <input type="checkbox" name="opt" value="optimize_image">
        <span>优化图片质量</span>
      </label>
    </div>
    <p id="pp-error" class="form-error" role="alert" hidden></p>
    <div class="pp-actions">
      <button type="button" id="pp-cancel" class="btn btn-ghost">取消</button>
      <button type="submit" id="pp-confirm" class="btn btn-primary" disabled>确认处理</button>
    </div>
  </form>
</dialog>

<dialog id="draft-dialog" class="pp-dialog" aria-labelledby="draft-title">
  <div class="pp-form">
    <h2 id="draft-title" class="pp-title">图片优化提示词尚未保存</h2>
    <p class="pp-sub">请选择保存修改、丢弃修改，或取消当前操作继续编辑。</p>
    <div class="pp-actions draft-actions">
      <button type="button" id="draft-cancel" class="btn btn-ghost">取消</button>
      <button type="button" id="draft-discard" class="btn">丢弃</button>
      <button type="button" id="draft-save" class="btn btn-primary">保存</button>
    </div>
  </div>
</dialog>

<script src="app.js"></script>
</body>
</html>
